name: kondis-e2e

services:
  kondis-server:
    container_name: kondis-e2e-server
    image: kondis-server:latest
    build:
      context: ../
      dockerfile: server/Dockerfile
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: kondis
      KONDIS_PORT: '2295'
      KONDIS_STORAGE_DIR: /tmp/kondis-uploads
      KONDIS_SETUP_TOKEN: e2e-setup-token
    volumes:
      - ./test-assets:/test-assets
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 2295:2295

  database:
    container_name: kondis-e2e-postgres
    build:
      context: ../packages/postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: 18
        VECTORCHORD_TAG: 1.1.1
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: kondis
    ports:
      - 5435:5432
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kondis']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s
