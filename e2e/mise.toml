[tasks.install]
depends = ["//packages/sdk:build"]
run = "pnpm install --filter kondis-e2e --frozen-lockfile --config.confirmModulesPurge=false"

[tasks.build]
dir = "{{ config_root }}"
run = "docker compose build"

[tasks.test]
depends = ["//e2e:build", "//e2e:ci-setup"]
env._.path = "./node_modules/.bin"
run = "vitest --run"

[tasks.playwright-install]
depends = ["//e2e:install"]
env._.path = "./node_modules/.bin"
run = "playwright install chromium firefox webkit"

[tasks.build-web]
depends = ["//web:install", "//e2e:install"]
run = [
  "pnpm --filter kondis-server build",
  "pnpm --filter @kondis/web build",
]

[tasks."test-web"]
depends = ["//e2e:build-web", "//e2e:playwright-install"]
env._.path = "./node_modules/.bin"
run = "playwright test"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."

[tasks.lint]
env._.path = "./node_modules/.bin"
run = "eslint \"src/**/*.ts\" --max-warnings 0"

[tasks."lint-fix"]
run = { task = "lint --fix" }

[tasks.check]
env._.path = "./node_modules/.bin"
run = "tsc --noEmit"

[tasks.ci-setup]
run = { task = ":install" }

[tasks.ci-unit]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
]
