name: kondis-dev

services:
  kondis-app-base:
    profiles: ['_base']
    tmpfs:
      - /tmp
    volumes:
      - ..:/usr/src/app
      - build_cache:/buildcache
      - app_node_modules:/usr/src/app/node_modules
      - pnpm_store:/usr/src/app/.pnpm-store
      - server_node_modules:/usr/src/app/server/node_modules
      - web_node_modules:/usr/src/app/web/node_modules
      - sveltekit:/usr/src/app/web/.svelte-kit

  kondis-init:
    extends:
      service: kondis-app-base
    profiles: !reset []
    container_name: kondis_init
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    command:
      - |
        pnpm install --frozen-lockfile
        touch /tmp/init-complete
        exec tail -f /dev/null
    volumes:
      - build_cache:/buildcache
    restart: 'no'
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/init-complete']
      interval: 2s
      timeout: 3s
      retries: 300
      start_period: 300s

  kondis-server:
    extends:
      service: kondis-app-base
    profiles: !reset []
    container_name: kondis_server
    command: ['kondis-dev']
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    restart: unless-stopped
    volumes:
      - ${DATA_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2293:2293
    depends_on:
      kondis-init:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:2293/api/v1/ping').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  kondis-reset:
    extends:
      service: kondis-app-base
    profiles: ['tools']
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    command: ['pnpm --dir server db:reset-development-data -- --confirm']
    volumes:
      - ${DATA_LOCATION}/data:/data
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  kondis-web:
    extends:
      service: kondis-app-base
    profiles: !reset []
    container_name: kondis_web
    command: ['kondis-web']
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    env_file:
      - .env
    restart: unless-stopped
    environment:
      KONDIS_API_URL: http://kondis-server:2293
      KONDIS_VITE_USE_POLLING: 'true'
    ports:
      - 3000:3000
    depends_on:
      kondis-init:
        condition: service_healthy
      kondis-server:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  database:
    container_name: kondis_postgres
    build:
      context: ../packages/postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: 18
        VECTORCHORD_TAG: 1.1.1
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  app_node_modules:
  build_cache:
  pnpm_store:
  server_node_modules:
  web_node_modules:
  sveltekit:
  postgres_data:
