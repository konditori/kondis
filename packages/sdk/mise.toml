[tasks.install]
run = "pnpm install --filter @kondis/sdk --frozen-lockfile"

[tasks.build]
env._.path = "./node_modules/.bin"
run = "tsc"

[tasks.check]
env._.path = "./node_modules/.bin"
run = "tsc --noEmit"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."
