name: kondis-demo-db

services:
  database:
    container_name: kondis_demo_postgres
    build:
      context: ../../packages/postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: 17
        VECTORCHORD_TAG: 1.1.1
    environment:
      POSTGRES_USER_FILE: /run/secrets/demo_db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/demo_db_password
      POSTGRES_DB: ${DEMO_DB_DATABASE_NAME:-kondis_demo}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DEMO_DB_DATA_DIR:-./data}:/var/lib/postgresql
    ports:
      - "${DEMO_DB_BIND_ADDRESS:-0.0.0.0}:${DEMO_DB_PORT:-5432}:5432"
    secrets:
      - demo_db_username
      - demo_db_password

  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      KONDIS_CLOUD_NODE_PROCESSOR_ENABLED: "true"
      KONDIS_DEMO_MODE: "true"
      KONDIS_DB_HOSTNAME: database
      KONDIS_DB_PORT: 5432
      KONDIS_DB_DATABASE_NAME: ${DEMO_DB_DATABASE_NAME:-kondis_demo}
      KONDIS_STORAGE_DIR: /data
    volumes:
      - ${DEMO_SERVER_DATA_DIR:-./server-data}:/data
    secrets:
      - demo_db_username
      - demo_db_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export KONDIS_DB_USERNAME="$$(cat /run/secrets/demo_db_username)"
        export KONDIS_DB_PASSWORD="$$(cat /run/secrets/demo_db_password)"
        exec node dist/bin/cloud-node-processor.js
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  seeder:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      KONDIS_DB_HOSTNAME: database
      KONDIS_DB_PORT: 5432
      KONDIS_DB_DATABASE_NAME: ${DEMO_DB_DATABASE_NAME:-kondis_demo}
      KONDIS_DEMO_MEDIA_DIR: /usr/src/app/demo-media
      KONDIS_STORAGE_DIR: /data
    volumes:
      - ../../test/test-assets/demo/v1:/usr/src/app/demo-media:ro
      - ${DEMO_SERVER_DATA_DIR:-./server-data}:/data
    secrets:
      - demo_db_username
      - demo_db_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export KONDIS_DB_USERNAME="$$(cat /run/secrets/demo_db_username)"
        export KONDIS_DB_PASSWORD="$$(cat /run/secrets/demo_db_password)"
        exec node dist/bin/provision-demo.js
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

secrets:
  demo_db_username:
    file: ${DEMO_DB_USERNAME_FILE:?DEMO_DB_USERNAME_FILE must point to the database username file}
  demo_db_password:
    file: ${DEMO_DB_PASSWORD_FILE:?DEMO_DB_PASSWORD_FILE must point to the database password file}
