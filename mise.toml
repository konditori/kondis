monorepo_root = true

[monorepo]
config_roots = [
  "android",
  "server",
  "web",
  "e2e",
]

[tools]
node = "24.19.0"
pnpm = "11.22.0"
"npm:oazapfts" = "7.5.0"

[settings]
pin = true
lockfile = true

[tasks.dev]
dir = "docker"
interactive = true
env = { COMPOSE_BAKE = true }
run = "docker compose -f ./docker-compose.dev.yml up --remove-orphans"
depends_post = "dev-down"

[tasks.dev-update]
run = { task = "//:dev", args = ["--build", "-V"] }

[tasks.dev-down]
dir = "docker"
run = "docker compose -f ./docker-compose.dev.yml down --remove-orphans"

[tasks.e2e]
run = { task = "//e2e:test" }

[tasks.format]
description = "Check formatting across the project"
run = [
  { task = "//web:format" },
  { task = "//server:format" },
  { task = "//e2e:format" },
  { task = "//android:format" },
]

[tasks."format-fix"]
description = "Fix formatting across the project"
run = [
  { task = "//web:format-fix" },
  { task = "//server:format-fix" },
  { task = "//e2e:format-fix" },
  { task = "//android:format-fix" },
]

[tasks.lint]
description = "Run lint checks across the project"
run = [
  { task = "//web:check" },
  { task = "//server:lint" },
  { task = "//e2e:lint" },
  { task = "//android:lint" },
]

[tasks."lint-fix"]
description = "Fix lint issues across the project"
run = [
  { task = "//web:check" },
  { task = "//server:lint-fix" },
  { task = "//e2e:lint-fix" },
  { task = "//android:lint-fix" },
]

[tasks."ci:server-medium"]
description = "Install server dependencies and run the CI medium-test suite (requires Docker)"
run = [
  { task = "//server:install" },
  { task = "//server:test-medium" },
]

[tasks."ci:server-medium-typecheck"]
description = "Install server dependencies and typecheck the medium-test suite"
run = [
  { task = "//server:install" },
  { task = "//server:test-medium-typecheck" },
]

[tasks.e2e-update]
run = { task = "//e2e:test" }

[tasks.e2e-env]
dir = "e2e"
interactive = true
env = { COMPOSE_BAKE = true }
run = "docker compose -f ./docker-compose.yml up --build -V --remove-orphans"
depends_post = "//:e2e-down"

[tasks.e2e-down]
dir = "e2e"
run = "docker compose -f ./docker-compose.yml down --remove-orphans"

[tasks."open-api:typescript"]
run = [
  "mkdir -p server/src/open-api",
  "oazapfts --optimistic --argumentStyle=object --useEnumType --allSchemas open-api/kondis-openapi-specs.json server/src/open-api/fetch-client.ts",
  # The generated client is committed, so format it here. Otherwise every regeneration leaves
  # the tree failing `prettier --check` and produces noisy diffs.
  "cd server && ./node_modules/.bin/prettier --log-level warn --write src/open-api/fetch-client.ts",
]

[tasks."open-api"]
run = [
  { task = "//server:sync-open-api" },
  { task = ":open-api:typescript" },
]

# Regenerates the attribution file the AGPL and our permissive dependencies both require.
# Committed rather than built on demand, so the notices are readable from the repository.
[tasks."third-party-licenses"]
run = { task = "//server:third-party-licenses" }

[tasks."i18n:check"]
description = "Validate the shared translation catalogs"
run = "node ./scripts/check-i18n.mjs"

[tasks."i18n:android"]
description = "Generate Android string resources from the shared translation catalogs"
depends = ["i18n:check"]
run = "node ./scripts/generate-android-i18n.mjs"
