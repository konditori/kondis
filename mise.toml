monorepo_root = true

[monorepo]
config_roots = [
  "android",
  "server",
  "web",
  "e2e",
  "packages/sdk",
  "docs",
  "static/apps/developers.kondis.org",
  "static/apps/kondis.org",
]

[tools]
node = "24.19.0"
pnpm = "11.22.0"
"npm:oazapfts" = "7.5.0"

[settings]
pin = true
lockfile = true

[tasks.dev]
dir = "docker"
interactive = true
env = { COMPOSE_BAKE = true }
run = "docker compose -f ./docker-compose.dev.yml up --remove-orphans"
depends_post = "dev-down"

[tasks.dev-update]
run = { task = "//:dev", args = ["--build", "-V"] }

[tasks.dev-down]
dir = "docker"
run = "docker compose -f ./docker-compose.dev.yml down --remove-orphans"

[tasks.e2e]
run = { task = "//e2e:test" }

[tasks."docs:install"]
run = { task = "//docs:install" }

[tasks."docs:dev"]
description = "Start the Docusaurus documentation site"
run = { task = "//docs:dev" }

[tasks."docs:build"]
description = "Build the documentation site"
run = { task = "//docs:build" }

[tasks."api-docs:build"]
description = "Build the generated API reference"
run = { task = "//static/apps/api.kondis.org:build" }

[tasks."docs:serve"]
description = "Serve the built documentation site"
run = { task = "//docs:serve" }

[tasks."docs:clear"]
description = "Clear Docusaurus cache and generated files"
run = { task = "//docs:clear" }

[tasks.format]
description = "Check formatting across the project"
run = [
  { task = "//web:format" },
  { task = "//server:format" },
  { task = "//e2e:format" },
  { task = "//packages/sdk:format" },
  { task = "//static/apps/api.kondis.org:format" },
  { task = "//android:format" },
]

[tasks."format-fix"]
description = "Fix formatting across the project"
run = [
  { task = "//web:format-fix" },
  { task = "//server:format-fix" },
  { task = "//e2e:format-fix" },
  { task = "//packages/sdk:format-fix" },
  { task = "//static/apps/api.kondis.org:format-fix" },
  { task = "//android:format-fix" },
]

[tasks.lint]
description = "Run lint checks across the project"
run = [
  { task = "//web:check" },
  { task = "//server:lint" },
  { task = "//e2e:lint" },
  { task = "//packages/sdk:check" },
  { task = "//static/apps/api.kondis.org:check" },
  { task = "//android:lint" },
]

[tasks."lint-fix"]
description = "Fix lint issues across the project"
run = [
  { task = "//web:check" },
  { task = "//server:lint-fix" },
  { task = "//e2e:lint-fix" },
  { task = "//android:lint-fix" },
]

[tasks."ci:server-medium"]
description = "Install server dependencies and run the CI medium-test suite (requires Docker)"
run = [
  { task = "//server:install" },
  { task = "//server:test-medium" },
]

[tasks."ci:server-medium-typecheck"]
description = "Install server dependencies and typecheck the medium-test suite"
run = [
  { task = "//server:install" },
  { task = "//server:test-medium-typecheck" },
]

[tasks.e2e-update]
run = { task = "//e2e:test" }

[tasks.e2e-env]
dir = "e2e"
interactive = true
env = { COMPOSE_BAKE = true }
run = "docker compose -f ./docker-compose.yml up --build -V --remove-orphans"
depends_post = "//:e2e-down"

[tasks.e2e-down]
dir = "e2e"
run = "docker compose -f ./docker-compose.yml down --remove-orphans"

[tasks."open-api:typescript"]
run = [
  "pnpm install --filter @kondis/sdk --frozen-lockfile",
  "oazapfts --optimistic --argumentStyle=object --useEnumType --allSchemas open-api/kondis-openapi-specs.json packages/sdk/src/fetch-client.ts",
  "cd packages/sdk && ./node_modules/.bin/prettier --log-level warn --write src/fetch-client.ts",
  "pnpm --filter @kondis/sdk build",
]

[tasks."open-api"]
run = [
  { task = "//server:sync-open-api" },
  { task = ":open-api:typescript" },
]

[tasks."third-party-licenses"]
run = { task = "//server:third-party-licenses" }

[tasks."i18n:check"]
description = "Validate translation catalogs and user-visible strings"
run = [
  "node ./scripts/check-json-duplicates.mjs",
  "node ./scripts/check-i18n.mjs",
  "node ./scripts/check-web-i18n.mjs",
]

[tasks."i18n:android"]
description = "Generate Android string resources from the shared translation catalogs"
depends = ["i18n:check"]
run = "node ./scripts/generate-android-i18n.mjs"
