name: Demo

on:
  workflow_dispatch:
  push:
    branches: [main, feat/durable-object-websockets]

concurrency:
  group: demo-main
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Rebuild and deploy demo
    if: >-
      ${{
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/feat/durable-object-websockets'
      }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KONDIS_DB_TUNNEL_HOSTNAME: ${{ vars.KONDIS_DB_TUNNEL_HOSTNAME }}
      KONDIS_DB_TUNNEL_LOCAL_PORT: "15432"
      KONDIS_DB_DATABASE_NAME: kondis-demo
      KONDIS_DB_MIGRATOR_USERNAME: kondis_migrator
      KONDIS_DB_MIGRATOR_PASSWORD: ${{ secrets.KONDIS_DB_MIGRATOR_PASSWORD }}
      KONDIS_DB_RUNTIME_USERNAME: kondis_runtime
      KONDIS_DB_RUNTIME_PASSWORD: ${{ secrets.KONDIS_DB_RUNTIME_PASSWORD }}
      KONDIS_DB_TUNNEL_CLIENT_ID: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_ID }}
      KONDIS_DB_TUNNEL_CLIENT_SECRET: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_SECRET }}
      KONDIS_HYPERDRIVE_ID: ${{ vars.KONDIS_DEMO_HYPERDRIVE_ID }}
      KONDIS_HYPERDRIVE_NAME: kondis-demo
      KONDIS_HYPERDRIVE_ACCESS_CLIENT_ID: ${{ secrets.KONDIS_HYPERDRIVE_ACCESS_CLIENT_ID }}
      KONDIS_HYPERDRIVE_ACCESS_CLIENT_SECRET: ${{ secrets.KONDIS_HYPERDRIVE_ACCESS_CLIENT_SECRET }}
      KONDIS_HYPERDRIVE_CA_CERTIFICATE_ID: ${{ vars.KONDIS_DEMO_HYPERDRIVE_CA_CERTIFICATE_ID }}
      KONDIS_HYPERDRIVE_ORIGIN_CONNECTION_LIMIT: "5"
      KONDIS_DEMO_SMOKE_ACCESS_CLIENT_ID: ${{ secrets.KONDIS_DEMO_SMOKE_ACCESS_CLIENT_ID }}
      KONDIS_DEMO_SMOKE_ACCESS_CLIENT_SECRET: ${{ secrets.KONDIS_DEMO_SMOKE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout code and demo media
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.9.0
          CLOUDFLARED_SHA256: 53b7a7a5420d188758d24341294acb0d1bca54296548ac05e38811a694ac6134
        run: |
          curl --fail --location --show-error \
            --output /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum --check --status
          install -m 0755 /tmp/cloudflared "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify demo smoke-test Access policy
        run: |
          if [[ -z "$KONDIS_DEMO_SMOKE_ACCESS_CLIENT_ID" || -z "$KONDIS_DEMO_SMOKE_ACCESS_CLIENT_SECRET" ]]; then
            echo "Demo smoke-test Access credentials must be set" >&2
            exit 2
          fi
          curl --fail --show-error --silent --retry 2 --retry-all-errors \
            --header "CF-Access-Client-Id: $KONDIS_DEMO_SMOKE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $KONDIS_DEMO_SMOKE_ACCESS_CLIENT_SECRET" \
            https://demo.kondis.org/cdn-cgi/access/get-identity >/dev/null

      - name: Enable maintenance mode
        run: bash deployment/demo/bin/maintenance.sh enable

      - name: Recreate and seed demo database
        run: mise run postgres:demo-reset

      - name: Update main Hyperdrive configuration
        run: bash deployment/demo/bin/hyperdrive.sh update "$KONDIS_HYPERDRIVE_ID" >/dev/null

      - name: Deploy demo Workers
        run: mise run deploy:demo

      - name: Smoke test public demo
        run: |
          if ! curl --fail --show-error --silent --retry 5 --retry-all-errors \
            --header "CF-Access-Client-Id: $KONDIS_DEMO_SMOKE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $KONDIS_DEMO_SMOKE_ACCESS_CLIENT_SECRET" \
            "https://demo.kondis.org/api/v1/ping?deployment=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | jq --exit-status '.status == "pong"' >/dev/null; then
            bash deployment/demo/bin/maintenance.sh enable
            exit 1
          fi
