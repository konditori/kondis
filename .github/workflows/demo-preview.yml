name: Demo Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: demo-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy PR demo
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KONDIS_DB_TUNNEL_HOSTNAME: ${{ vars.KONDIS_DB_TUNNEL_HOSTNAME }}
      KONDIS_DB_TUNNEL_LOCAL_PORT: "15432"
      KONDIS_DB_DATABASE_NAME: kondis-demo-pr-${{ github.event.pull_request.number }}
      KONDIS_DB_MIGRATOR_USERNAME: kondis_migrator
      KONDIS_DB_MIGRATOR_PASSWORD: ${{ secrets.KONDIS_DB_MIGRATOR_PASSWORD }}
      KONDIS_DB_RUNTIME_USERNAME: kondis_demo_pr_${{ github.event.pull_request.number }}
      KONDIS_DB_TUNNEL_CLIENT_ID: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_ID }}
      KONDIS_DB_TUNNEL_CLIENT_SECRET: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_SECRET }}
      KONDIS_HYPERDRIVE_NAME: kondis-demo-pr-${{ github.event.pull_request.number }}
      KONDIS_HYPERDRIVE_ACCESS_CLIENT_ID: ${{ secrets.KONDIS_HYPERDRIVE_ACCESS_CLIENT_ID }}
      KONDIS_HYPERDRIVE_ACCESS_CLIENT_SECRET: ${{ secrets.KONDIS_HYPERDRIVE_ACCESS_CLIENT_SECRET }}
      KONDIS_HYPERDRIVE_CA_CERTIFICATE_ID: ${{ vars.KONDIS_DEMO_HYPERDRIVE_CA_CERTIFICATE_ID }}
      KONDIS_HYPERDRIVE_ORIGIN_CONNECTION_LIMIT: "5"
    steps:
      - name: Checkout PR and demo media
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.9.0
          CLOUDFLARED_SHA256: 53b7a7a5420d188758d24341294acb0d1bca54296548ac05e38811a694ac6134
        run: |
          curl --fail --location --show-error \
            --output /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum --check --status
          install -m 0755 /tmp/cloudflared "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate preview database password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "KONDIS_DB_RUNTIME_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Recreate and seed preview database
        run: mise run postgres:demo-reset

      - name: Create or update preview Hyperdrive
        run: |
          hyperdrive_id="$(bash deployment/demo/bin/hyperdrive.sh ensure)"
          echo "KONDIS_HYPERDRIVE_ID=$hyperdrive_id" >> "$GITHUB_ENV"

      - name: Deploy preview Workers
        run: mise run deploy:demo -- --pr "${{ github.event.pull_request.number }}"

      - name: Smoke test preview
        run: |
          url="https://pr-${{ github.event.pull_request.number }}.demo.kondis.org"
          curl --fail --show-error --silent --retry 5 --retry-all-errors \
            --header "CF-Access-Client-Id: $KONDIS_DEMO_SMOKE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $KONDIS_DEMO_SMOKE_ACCESS_CLIENT_SECRET" \
            "$url/api/v1/ping?deployment=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | jq --exit-status '.status == "pong"' >/dev/null
          printf '### Demo preview\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete failed preview Workers
        if: ${{ failure() }}
        run: bash deployment/demo/bin/delete-preview.sh "${{ github.event.pull_request.number }}"

      - name: Delete failed preview Hyperdrive
        if: ${{ failure() }}
        run: bash deployment/demo/bin/hyperdrive.sh delete

      - name: Drop failed preview database and role
        if: ${{ failure() }}
        run: mise run postgres:demo-drop
