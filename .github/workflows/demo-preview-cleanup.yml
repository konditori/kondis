name: Demo Preview Cleanup

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to clean up
        required: true
        type: number

concurrency:
  group: demo-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  teardown:
    name: Delete PR demo
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KONDIS_DB_TUNNEL_HOSTNAME: ${{ vars.KONDIS_DB_TUNNEL_HOSTNAME }}
      KONDIS_DB_TUNNEL_LOCAL_PORT: "15432"
      KONDIS_DB_DATABASE_NAME: kondis-demo-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      KONDIS_DB_MIGRATOR_USERNAME: kondis_migrator
      KONDIS_DB_MIGRATOR_PASSWORD: ${{ secrets.KONDIS_DB_MIGRATOR_PASSWORD }}
      KONDIS_DB_RUNTIME_USERNAME: kondis_demo_pr_${{ github.event.pull_request.number || inputs.pr_number }}
      KONDIS_DB_TUNNEL_CLIENT_ID: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_ID }}
      KONDIS_DB_TUNNEL_CLIENT_SECRET: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_SECRET }}
      KONDIS_HYPERDRIVE_NAME: kondis-demo-pr-${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Validate PR number
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR number must be a positive integer" >&2
            exit 2
          fi

      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install server dependencies
        run: pnpm install --filter kondis-server --frozen-lockfile

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.9.0
          CLOUDFLARED_SHA256: 53b7a7a5420d188758d24341294acb0d1bca54296548ac05e38811a694ac6134
        run: |
          curl --fail --location --show-error \
            --output /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum --check --status
          install -m 0755 /tmp/cloudflared "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Delete preview Workers
        if: ${{ always() }}
        run: bash deployment/demo/bin/delete-preview.sh "$PR_NUMBER"

      - name: Delete preview Hyperdrive
        if: ${{ always() }}
        run: bash deployment/demo/bin/hyperdrive.sh delete

      - name: Drop preview database and role
        if: ${{ always() }}
        run: mise run postgres:demo-drop
