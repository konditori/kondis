name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  GRADLE_ARGS: --no-daemon --stacktrace --warning-mode=fail

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      # This validates the checked-in wrapper before running it and caches Gradle safely.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Kotlin style
        run: ./gradlew $GRADLE_ARGS -Djavax.net.ssl.trustStore="$JAVA_HOME/lib/security/cacerts" ktlintCheck

      - name: Android lint, unit tests and APK builds
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew $GRADLE_ARGS
          -Djavax.net.ssl.trustStore="$JAVA_HOME/lib/security/cacerts"
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload main-branch debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kondis-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Sign & Publish
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Require Android signing secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "Android release signing secrets are not configured." >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/kondis-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "KONDIS_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KONDIS_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KONDIS_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KONDIS_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >-
          ./gradlew $GRADLE_ARGS
          -Djavax.net.ssl.trustStore="$JAVA_HOME/lib/security/cacerts"
          :app:assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/kondis-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Kondis Android ${GITHUB_REF_NAME#android-v}"
