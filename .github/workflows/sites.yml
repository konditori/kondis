        with:
          name: developers-kondis-org-build-output
          path: sites/developers.kondis.org/build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  api-kondis-org:
    name: Check api.kondis.org
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./sites/api.kondis.org
    steps:
      - name: Checkout code
