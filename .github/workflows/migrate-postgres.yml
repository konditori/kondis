name: Migrate PostgreSQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Temporary branch target so this workflow can be tested before merging.
      - feat/durable-object-websockets
    paths:
      - "server/src/schema/migrations/**"
      - "server/src/bin/migrations.ts"
      - "server/src/db/**"
      - "server/src/repositories/database.repository.ts"
      - "server/mise.toml"
      - "deployment/postgres/bin/migrate-through-tunnel.sh"
      - ".github/workflows/migrate-postgres.yml"

concurrency:
  group: postgres-migrations-production
  cancel-in-progress: false

permissions: {}

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install server dependencies
        run: mise run //server:install

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.8.3
          CLOUDFLARED_SHA256: f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e
        run: |
          curl --fail --location --show-error \
            --output /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum --check --status
          install -m 0755 /tmp/cloudflared "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Apply pending migrations
        env:
          KONDIS_DB_TUNNEL_HOSTNAME: ${{ secrets.KONDIS_DB_TUNNEL_HOSTNAME }}
          KONDIS_DB_TUNNEL_LOCAL_PORT: "15432"
          KONDIS_DB_DATABASE_NAME: ${{ secrets.KONDIS_DB_DATABASE_NAME }}
          KONDIS_DB_MIGRATOR_USERNAME: ${{ secrets.KONDIS_DB_MIGRATOR_USERNAME }}
          KONDIS_DB_MIGRATOR_PASSWORD: ${{ secrets.KONDIS_DB_MIGRATOR_PASSWORD }}
          KONDIS_DB_TUNNEL_CLIENT_ID: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_ID }}
          KONDIS_DB_TUNNEL_CLIENT_SECRET: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_SECRET }}
        run: mise run postgres:migrate
