name: Migrate PostgreSQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Temporary branch target so this workflow can be tested before merging.
      - feat/durable-object-websockets
    paths:
      - "server/src/schema/migrations/**"
      - "server/src/bin/migrations.ts"
      - "server/src/db/**"
      - "server/src/repositories/database.repository.ts"
      - "server/mise.toml"
      - "deployment/postgres/bin/migrate-through-tunnel.sh"
      - ".github/workflows/migrate-postgres.yml"

concurrency:
  group: postgres-migrations-production
  cancel-in-progress: false

permissions: {}

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install server dependencies
        run: mise run //server:install

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.9.0
          CLOUDFLARED_SHA256: 53b7a7a5420d188758d24341294acb0d1bca54296548ac05e38811a694ac6134
        run: |
          curl --fail --location --show-error \
            --output /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum --check --status
          install -m 0755 /tmp/cloudflared "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Apply pending migrations
        env:
          KONDIS_DB_TUNNEL_HOSTNAME: ${{ secrets.KONDIS_DB_TUNNEL_HOSTNAME }}
          KONDIS_DB_TUNNEL_LOCAL_PORT: "15432"
          KONDIS_DB_DATABASE_NAME: ${{ secrets.KONDIS_DB_DATABASE_NAME }}
          KONDIS_DB_MIGRATOR_USERNAME: ${{ secrets.KONDIS_DB_MIGRATOR_USERNAME }}
          KONDIS_DB_MIGRATOR_PASSWORD: ${{ secrets.KONDIS_DB_MIGRATOR_PASSWORD }}
          KONDIS_DB_TUNNEL_CLIENT_ID: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_ID }}
          KONDIS_DB_TUNNEL_CLIENT_SECRET: ${{ secrets.KONDIS_DB_TUNNEL_CLIENT_SECRET }}
        run: |
          headers="$RUNNER_TEMP/cloudflare-access-headers"
          curl --silent --max-time 3 --output /dev/null --dump-header "$headers" \
            --http1.1 \
            --header "Connection: Upgrade" \
            --header "Upgrade: websocket" \
            --header "Sec-WebSocket-Version: 13" \
            --header "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            --header "CF-Access-Client-Id: $KONDIS_DB_TUNNEL_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $KONDIS_DB_TUNNEL_CLIENT_SECRET" \
            "https://$KONDIS_DB_TUNNEL_HOSTNAME/" || true
          status="$(awk '/^HTTP\// { status = $2 } END { print status }' "$headers")"
          ray="$(awk 'tolower($1) == "cf-ray:" { gsub("\r", "", $2); print $2; exit }' "$headers")"
          echo "Cloudflare Access preflight: HTTP ${status:-unknown}, Ray ${ray:-unknown}"
          if [[ "$status" != "101" ]]; then
            exit 1
          fi
          mise run postgres:migrate
