name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    name: Check What Should Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check what should run
        id: check
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            server:
              - 'server/**'
              - 'test/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            e2e:
              - 'e2e/**'
              - 'server/**'
              - 'test/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            web:
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            docs:
              - 'docs/**'
              - 'static/apps/api.kondis.org/**'
              - 'open-api/kondis-openapi-specs.json'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            workflow:
              - '.github/workflows/test.yml'

  server-check:
    name: Check Server
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      - name: Run lint
        run: mise run //server:lint
        continue-on-error: true

      - name: Run format check
        run: mise run //server:format
        continue-on-error: true

      - name: Run typecheck
        run: mise run //server:check
        continue-on-error: true

      - name: Run unit tests
        run: mise run //server:test
        continue-on-error: true

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  e2e-check:
    name: Check E2E
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //e2e:install

      - name: Run lint
        run: mise run //e2e:lint

      - name: Run format check
        run: mise run //e2e:format

  web-check:
    name: Check Web
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@1af396ae134e4bc3b63d947e672bc68bf4ff9dc5 # create-workflow-token-action-v3.0.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.2.0
        with:
          github_token: ${{ steps.token.outputs.token }}

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: mise run //web:format

      - name: Run checks
        run: mise run //web:check
        if: ${{ !cancelled() }}

      - name: Build production web server
        run: pnpm build

  web-unit-tests:
    name: Test Web
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@1af396ae134e4bc3b63d947e672bc68bf4ff9dc5 # create-workflow-token-action-v3.0.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.2.0
        with:
          github_token: ${{ steps.token.outputs.token }}

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --if-present test

  docs-check:
    name: Check Documentation
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).docs == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //docs:install

      - name: Install API documentation dependencies
        run: mise run //static/apps/api.kondis.org:install

      - name: Check formatting
        run: mise run //docs:format

      - name: Check API documentation formatting
        run: mise run //static/apps/api.kondis.org:format

      - name: Build documentation
        run: mise run //docs:build

      - name: Build API documentation
        run: mise run //static/apps/api.kondis.org:build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build-output
          path: |
            docs/build/
            static/apps/api.kondis.org/build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  server-medium-tests:
    name: Medium Tests (Server)
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Run medium tests
        run: mise run //:ci:server-medium

      - name: Capture Docker logs
        if: failure()
        run: |
          docker ps -a
          docker logs $(docker ps -aq --filter "name=testcontainers") || true

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: failure()
        with:
          name: server-medium-docker-logs
          path: |
            /tmp/testcontainers-nodejs/*.log

  server-medium-typecheck:
    name: Medium Tests Typecheck (Server)
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Typecheck medium tests
        run: mise run //:ci:server-medium-typecheck

  e2e-tests:
    name: End-to-End Tests
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Run e2e tests
        run: mise run //e2e:test

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: e2e-docker-logs
          path: docker-compose-logs.txt

  generated-api-up-to-date:
      name: OpenAPI Clients
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - id: token
          uses: immich-app/devtools/actions/create-workflow-token@1af396ae134e4bc3b63d947e672bc68bf4ff9dc5 # create-workflow-token-action-v3.0.0
          with:
            client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
            private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
            permission-contents: read

        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            token: ${{ steps.token.outputs.token }}

        - name: Setup Mise
          uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.2.0
          with:
            github_token: ${{ steps.token.outputs.token }}

        - name: Install server dependencies
          run: pnpm --filter kondis-server install --frozen-lockfile
        - name: Run API generation
          run: mise run //:open-api
          working-directory: open-api

        - name: Find file changes
          uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
          id: verify-changed-files
          with:
            files: |
              server/src/open-api/fetch-client.ts
              open-api/kondis-openapi-specs.json

        - name: Verify files have not changed
          if: steps.verify-changed-files.outputs.files_changed == 'true'
          env:
            CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          run: |
            echo "ERROR: Generated files not up to date!"
            echo "Changed files: ${CHANGED_FILES}"
            echo ""
            echo "Diff:"
            git --no-pager diff -- server/src/open-api/fetch-client.ts open-api/kondis-openapi-specs.json
            exit 1

  generated-translations-up-to-date:
    name: Translations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.2.0

      - name: Check translation catalogs
        run: mise run //:i18n:check

      - name: Regenerate Android translations
        run: mise run //:i18n:android

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: |
            android/app/src/main/res/values*/strings.xml

      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated translation resources are not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          echo ""
          echo "Run 'mise run //:i18n:android' and commit the result."
          echo "Diff:"
          git --no-pager diff -- android/app/src/main/res
          exit 1

  third-party-licenses-up-to-date:
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      - name: Regenerate third-party licenses
        run: mise run third-party-licenses

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: THIRD-PARTY-LICENSES.md

      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          echo "ERROR: THIRD-PARTY-LICENSES.md is out of date."
          echo "Run 'mise run third-party-licenses' and commit the result."
          echo "Diff:"
          git --no-pager diff -- THIRD-PARTY-LICENSES.md
          exit 1
