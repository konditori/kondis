name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    name: Check What Should Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check what should run
        id: check
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            server:
              - 'server/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            e2e:
              - 'e2e/**'
              - 'server/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            workflow:
              - '.github/workflows/test.yml'

  server-check:
    name: Check Server
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The FIT parser integration tests read a real recording from e2e/test-assets and
          # skip themselves when it is absent.
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      - name: Run lint
        run: mise run //server:lint

      - name: Run format check
        run: mise run //server:format

      - name: Run typecheck
        run: mise run //server:check

      - name: Run unit tests
        run: mise run //server:test

  e2e-check:
    name: Check E2E
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //e2e:install

      - name: Run lint
        run: mise run //e2e:lint

      - name: Run format check
        run: mise run //e2e:format

  server-medium-tests:
    name: Medium Tests (Server)
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).server == true || fromJSON(needs.pre-job.outputs.should_run).workflow == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      - name: Run medium tests
        run: mise exec -- pnpm run test:medium

      - name: Capture Docker logs
        if: failure()
        run: |
          docker ps -a
          docker logs $(docker ps -aq --filter "name=testcontainers") || true

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: failure()
        with:
          name: server-medium-docker-logs
          path: |
            /tmp/testcontainers-nodejs/*.log

  e2e-tests:
    name: End-to-End Tests
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Run e2e tests
        run: mise run //e2e:test

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: e2e-docker-logs
          path: docker-compose-logs.txt
