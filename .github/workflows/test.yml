name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    name: Check What Should Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check what should run
        id: check
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            server:
              - 'server/**'
              - 'test/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            e2e:
              - 'e2e/**'
              - 'server/**'
              - 'test/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            web:
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            workflow:
              - '.github/workflows/test.yml'

  server-check:
    name: Check Server
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      - name: Run lint
        run: mise run //server:lint

      - name: Run format check
        run: mise run //server:format

      - name: Run typecheck
        run: mise run //server:check

      - name: Run unit tests
        run: mise run //server:test

  e2e-check:
    name: Check E2E
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //e2e:install

      - name: Run lint
        run: mise run //e2e:lint

      - name: Run format check
        run: mise run //e2e:format

  web-lint:
    name: Lint Web
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@1af396ae134e4bc3b63d947e672bc68bf4ff9dc5 # create-workflow-token-action-v3.0.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@4d97fb30d9edd3ff0d735f411f607a35204eea79 # use-mise-action-v3.2.0
        with:
          github_token: ${{ steps.token.outputs.token }}

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check
        if: ${{ !cancelled() }}

  web-unit-tests:
    name: Test Web
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@1af396ae134e4bc3b63d947e672bc68bf4ff9dc5 # create-workflow-token-action-v3.0.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@4d97fb30d9edd3ff0d735f411f607a35204eea79 # use-mise-action-v3.2.0
        with:
          github_token: ${{ steps.token.outputs.token }}

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test --if-present

  server-medium-tests:
    name: Medium Tests (Server)
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      - name: Run medium tests
        run: mise run test-medium

      - name: Capture Docker logs
        if: failure()
        run: |
          docker ps -a
          docker logs $(docker ps -aq --filter "name=testcontainers") || true

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: failure()
        with:
          name: server-medium-docker-logs
          path: |
            /tmp/testcontainers-nodejs/*.log

  e2e-tests:
    name: End-to-End Tests
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Run e2e tests
        run: mise run //e2e:test

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: e2e-docker-logs
          path: docker-compose-logs.txt

  generated-api-up-to-date:
      name: OpenAPI Clients
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - id: token
          uses: immich-app/devtools/actions/create-workflow-token@1af396ae134e4bc3b63d947e672bc68bf4ff9dc5 # create-workflow-token-action-v3.0.0
          with:
            client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
            private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
            permission-contents: read

        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            token: ${{ steps.token.outputs.token }}

        - name: Setup Mise
          uses: immich-app/devtools/actions/use-mise@4d97fb30d9edd3ff0d735f411f607a35204eea79 # use-mise-action-v3.2.0
          with:
            github_token: ${{ steps.token.outputs.token }}

        - name: Install server dependencies
          run: pnpm --filter kondis-server install --frozen-lockfile
        - name: Run API generation
          run: mise run //:open-api
          working-directory: open-api

        - name: Find file changes
          uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
          id: verify-changed-files
          with:
            files: |
              server/src/open-api/fetch-client.ts
              open-api/kondis-openapi-specs.json

        - name: Verify files have not changed
          if: steps.verify-changed-files.outputs.files_changed == 'true'
          env:
            CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          run: |
            echo "ERROR: Generated files not up to date!"
            echo "Changed files: ${CHANGED_FILES}"
            echo ""
            echo "Diff:"
            git --no-pager diff -- server/src/open-api/fetch-client.ts open-api/kondis-openapi-specs.json
            exit 1

  third-party-licenses-up-to-date:
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0

      - name: Install dependencies
        run: mise run //server:install

      # Adding or bumping a dependency changes what we redistribute, so the attribution file has
      # to change with it. Regenerating here proves the committed copy still matches the tree.
      - name: Regenerate third-party licenses
        run: mise run third-party-licenses

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: THIRD-PARTY-LICENSES.md

      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          echo "ERROR: THIRD-PARTY-LICENSES.md is out of date."
          echo "Run 'mise run third-party-licenses' and commit the result."
          echo "Diff:"
          git --no-pager diff -- THIRD-PARTY-LICENSES.md
          exit 1
