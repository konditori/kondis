name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    name: Check What Should Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      e2e: ${{ steps.filter.outputs.e2e }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check what should run
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            e2e:
              - 'e2e/**'
              - 'server/**'
              - 'pnpm-lock.yaml'
              - 'mise.toml'
            workflow:
              - '.github/workflows/test.yml'

  server-check:
    name: Check Server
    needs: pre-job
    if: ${{ needs.pre-job.outputs.server == 'true' || needs.pre-job.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run //server:install

      - name: Run lint
        run: mise run //server:lint

      - name: Run format check
        run: mise run //server:format

  e2e-check:
    name: Check E2E
    needs: pre-job
    if: ${{ needs.pre-job.outputs.e2e == 'true' || needs.pre-job.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run //e2e:install

      - name: Run lint
        run: mise run //e2e:lint

      - name: Run format check
        run: mise run //e2e:format

  e2e-tests:
    name: End-to-End Tests
    needs: pre-job
    if: ${{ needs.pre-job.outputs.e2e == 'true' || needs.pre-job.outputs.server == 'true' || needs.pre-job.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Run e2e tests
        run: mise run //e2e:test

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: Archive Docker logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-docker-logs
          path: e2e/docker-compose-logs.txt
