[tasks.install]
run = "pnpm install --filter kondis-server --frozen-lockfile"

[tasks.build]
env._.path = "./node_modules/.bin"
# `nest build` was used here previously, but @nestjs/cli is not a dependency of this
# package. The tsc + tsc-alias pair in package.json is the build that actually works.
run = "tsc -p tsconfig.build.json && tsc-alias -p tsconfig.build.json"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."

[tasks.lint]
env._.path = "./node_modules/.bin"
run = "eslint \"src/**/*.ts\" --max-warnings 0"

[tasks."lint-fix"]
run = { task = "lint --fix" }

[tasks.check]
env._.path = "./node_modules/.bin"
run = "tsc --noEmit"

[tasks.test]
env._.path = "./node_modules/.bin"
run = "vitest run"

[tasks.migrate]
env._.path = "./node_modules/.bin"
run = "tsx src/bin/migrate.ts"

[tasks."db-codegen"]
env._.path = "./node_modules/.bin"
run = "kysely-codegen --dialect postgres --out-file src/db/schema.generated.ts"

[tasks."sync-open-api"]
env._.path = "./node_modules/.bin"
run = "tsx src/bin/sync-open-api.ts"