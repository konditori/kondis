[tasks.install]
run = "pnpm install --filter @kondis/web --frozen-lockfile"

[tasks.dev]
env._.path = "./node_modules/.bin"
run = "vite dev"

[tasks.build]
env._.path = "./node_modules/.bin"
run = "vite build"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks.lint-oxlint]
run = "pnpm run lint:oxlint"

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."

[tasks.check]
env._.path = "./node_modules/.bin"
run = "svelte-kit sync && svelte-check --tsconfig ./tsconfig.json"

[tasks.test]
env._.path = "./node_modules/.bin"
run = "vitest run"
