org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Maven Central is inspected by Cloudflare Zero Trust on this machine. Keep the
# additional CA project-scoped so it affects this build only, while retaining
# the normal Android Studio/JDK trust roots in the generated keystore.
systemProp.javax.net.ssl.trustStore=gradle/certs/maven-central-truststore.jks
systemProp.javax.net.ssl.trustStorePassword=changeit
systemProp.javax.net.ssl.trustStoreType=PKCS12
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
