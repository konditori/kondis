[tasks.install]
run = "pnpm install --filter @kondis/api-docs --frozen-lockfile"

[tasks.dev]
env._.path = "./node_modules/.bin"
run = "vite dev --port 3000"

[tasks.build]
env._.path = "./node_modules/.bin"
run = "vite build"

[tasks.serve]
env._.path = "./node_modules/.bin"
run = "vite preview"

[tasks.check]
env._.path = "./node_modules/.bin"
run = "svelte-kit sync && svelte-check --tsconfig ./tsconfig.json"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."
