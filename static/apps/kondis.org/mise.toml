[tasks.install]
run = "pnpm install --filter @kondis/landing --frozen-lockfile"

[tasks.vite]
description = "Start the landing site directly with Vite"
env._.path = "./node_modules/.bin"
run = "vite dev"

[tasks.dev]
description = "Start the landing site in Docker Compose on http://localhost:4173"
interactive = true
env = { COMPOSE_BAKE = true }
run = "docker compose -f ./docker-compose.dev.yml up --remove-orphans"
depends_post = "dev-down"

[tasks.dev-update]
description = "Rebuild the landing-site Docker environment and start it"
interactive = true
env = { COMPOSE_BAKE = true }
run = "docker compose -f ./docker-compose.dev.yml up --build -V --remove-orphans"
depends_post = "dev-down"

[tasks.dev-down]
description = "Stop the landing-site Docker environment"
run = "docker compose -f ./docker-compose.dev.yml down --remove-orphans"

[tasks.build]
env._.path = "./node_modules/.bin"
run = "vite build"

[tasks.preview]
env._.path = "./node_modules/.bin"
run = "vite preview"

[tasks.check]
env._.path = "./node_modules/.bin"
run = "svelte-kit sync && svelte-check --tsconfig ./tsconfig.json"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."
